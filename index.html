<!DOCTYPE html>
<html lang="fr">
<head>
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savant Fou</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:         #080506;
  --card:       #100a0c;
  --card-2:     #0a0607;
  --card-hover: #181013;
  --card-active:#1e1416;
  --border:     #28181c;
  --border-lit: #3e2830;
  --wine:       #3e1319;
  --burgundy:   #5c2028;
  --crimson:    #8f2c38;
  --blood:      #b04a52;
  --gold:       #c9a961;
  --gem:        #7dc9b8;
  --green:      #6eb87a;
  --red:        #c66060;
  --bone:       #e6dcda;
  --text:       #d8cac8;
  --dim:        #a89898;
  --faint:      #6a5858;
  --radius:     14px;
  --radius-sm:  10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(143,44,56,0.10) 0%, transparent 70%), radial-gradient(ellipse 60% 50% at 50% 100%, rgba(62,19,25,0.08) 0%, transparent 70%), var(--bg);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  padding: 14px 12px 60px;
  user-select: none;
  -webkit-user-select: none;
  overflow-x: hidden;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
#app { max-width: 940px; margin: 0 auto; }

/* BANNIÈRE */
.banner { display: flex; align-items: center; gap: 14px; background: linear-gradient(155deg, #1a0c10 0%, #0a0506 100%); border: 1px solid var(--border-lit); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 12px; position: relative; overflow: hidden; box-shadow: 0 4px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03); }
.banner::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 15% 50%, rgba(143,44,56,0.10), transparent 60%); pointer-events: none; }
.banner::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--crimson), transparent); opacity: 0.6; }
.logo-virus { width: 44px; height: 44px; flex-shrink: 0; position: relative; z-index: 1; animation: virusPulse 2.6s ease-in-out infinite; filter: drop-shadow(0 0 8px rgba(176,74,82,0.35)); }
@keyframes virusPulse { 0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 8px rgba(176,74,82,0.35)); } 50% { transform: scale(1.06) rotate(6deg); filter: drop-shadow(0 0 14px rgba(176,74,82,0.55)); } }
.banner-text { flex: 1; min-width: 0; z-index: 1; }
.banner-title { font-size: 22px; font-weight: 900; letter-spacing: 3px; background: linear-gradient(135deg, var(--blood) 0%, var(--gold) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1; }
.banner-sub { font-size: 10px; color: var(--faint); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; font-weight: 600; }
.gems-badge { display: flex; align-items: center; gap: 6px; z-index: 1; background: linear-gradient(155deg, #0c1a1c, #051012); border: 1px solid #1d3e42; border-radius: 20px; padding: 8px 14px; font-weight: 800; font-size: 15px; color: var(--gem); box-shadow: 0 0 16px rgba(125,201,184,0.10); }
.gems-badge .icon { font-size: 16px; }

/* TOPBAR */
.topbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.stat-card { background: linear-gradient(155deg, var(--card) 0%, var(--card-2) 100%); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 4px 20px rgba(0,0,0,0.4); }
.stat-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1.4px; font-weight: 700; margin-bottom: 6px; }
.stat-value { font-size: 24px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.1; }
.stat-value.gold { color: var(--gold); }
.stat-value.blood { color: var(--blood); text-shadow: 0 0 16px rgba(176,74,82,0.20); }
.stat-sub { font-size: 11px; color: var(--faint); margin-top: 4px; font-weight: 500; }

/* ÉNERGIE / PALIER */
.energy-card, .milestone-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 10px; }
.energy-head, .milestone-head { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; margin-bottom: 6px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
.energy-head .val { color: var(--bone); }
.milestone-head .val { color: var(--gold); }
.milestone-head .count { color: var(--faint); font-size: 10px; }
.energy-bar, .milestone-bar { height: 8px; background: #050203; border-radius: 4px; overflow: hidden; border: 1px solid #1a080c; }
.milestone-bar { height: 6px; }
.energy-fill { height: 100%; background: linear-gradient(90deg, var(--wine), var(--crimson)); box-shadow: 0 0 10px rgba(143,44,56,0.4) inset; transition: width 0.09s linear; }
.milestone-fill { height: 100%; background: linear-gradient(90deg, var(--wine), var(--burgundy), var(--crimson)); box-shadow: 0 0 10px rgba(143,44,56,0.4) inset; transition: width 0.25s ease; }

/* TABS */
.tabs { display: flex; gap: 4px; margin-bottom: 14px; background: var(--card-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1; background: transparent; border: none; color: var(--dim); padding: 10px 4px; border-radius: var(--radius-sm); font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; letter-spacing: 0.2px; transition: all 0.15s; white-space: nowrap; }
.tab:hover { color: var(--text); background: var(--card-hover); }
.tab.active { background: linear-gradient(155deg, var(--burgundy), var(--crimson)); color: var(--bone); box-shadow: 0 2px 10px rgba(92,32,40,0.4), 0 0 0 1px var(--border-lit) inset; }

/* SECTIONS */
.section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--dim); font-weight: 700; margin: 18px 4px 10px; display: flex; justify-content: space-between; align-items: center; }
.section-title .tag { font-size: 10px; color: var(--faint); font-weight: 600; letter-spacing: 0.5px; }

/* MISSIONS QUOTIDIENNES */
.missions-grid { display: grid; gap: 8px; margin-bottom: 12px; }
.mission-card { background: linear-gradient(155deg, var(--card), var(--card-2)); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
.mission-info { flex: 1; padding-right: 10px; }
.mission-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 6px; line-height: 1.3; }
.mission-reward { font-size: 11px; color: var(--gold); font-weight: 700; }
.mission-progress { font-size: 16px; font-weight: 800; color: var(--blood); flex-shrink: 0; }
.mission-card.completed { border-color: var(--green); background: linear-gradient(155deg, #0a2418, #051210); }
.mission-card.completed .mission-progress { color: var(--green); }

/* BADGES */
.badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.badge-card { background: linear-gradient(155deg, var(--card), var(--card-2)); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; text-align: center; opacity: 0.4; filter: grayscale(1); transition: all 0.3s; }
.badge-card.unlocked { opacity: 1; filter: grayscale(0); border-color: var(--gold); box-shadow: 0 0 12px rgba(201,169,97,0.15); background: linear-gradient(155deg, #1a1408, #0a0804); }
.badge-icon { font-size: 24px; margin-bottom: 4px; }
.badge-name { font-size: 11px; font-weight: 800; color: var(--gold); margin-bottom: 2px; line-height: 1.2; }
.badge-desc { font-size: 9px; color: var(--dim); }
.badge-reward { font-size: 10px; color: var(--gem); font-weight: 700; margin-top: 4px; }

/* CONTINENTS */
.continents-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.continent-card { background: linear-gradient(155deg, var(--card), var(--card-2)); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; transition: all 0.2s cubic-bezier(0.2,0.8,0.3,1); position: relative; overflow: hidden; }
.continent-card:hover { border-color: var(--border-lit); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,0.5), 0 0 16px rgba(92,32,40,0.15); }
.continent-card:active { transform: translateY(-1px); }
.continent-card.dead { opacity: 0.45; cursor: default; }
.continent-card.dead:hover { transform: none; box-shadow: none; border-color: var(--border); }
.cont-name { font-size: 15px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.cont-pct { font-size: 26px; font-weight: 800; color: var(--blood); letter-spacing: -1px; line-height: 1; }
.cont-count { font-size: 11px; color: var(--faint); margin-top: 4px; font-weight: 500; }
.cont-bar { height: 3px; background: #050203; border-radius: 2px; margin-top: 10px; overflow: hidden; }
.cont-bar-fill { height: 100%; background: linear-gradient(90deg, var(--burgundy), var(--blood)); box-shadow: 0 0 8px rgba(176,74,82,0.3); transition: width 0.25s ease; }
.cont-badge { position: absolute; top: 10px; right: 10px; font-size: 14px; }

/* UPGRADES */
.upgrades { display: grid; gap: 8px; }
.upgrade-btn { background: linear-gradient(155deg, var(--card), var(--card-2)); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 14px; text-align: left; color: var(--text); font-family: inherit; transition: all 0.18s cubic-bezier(0.2,0.8,0.3,1); width: 100%; }
.upgrade-btn:hover:not(:disabled) { border-color: var(--burgundy); background: linear-gradient(155deg, var(--card-hover), var(--card-2)); box-shadow: 0 0 20px rgba(92,32,40,0.15); }
.upgrade-btn:active:not(:disabled) { transform: scale(0.995); }
.upgrade-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.up-icon { font-size: 24px; flex-shrink: 0; }
.up-info { flex: 1; min-width: 0; }
.up-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
.up-name .lvl { color: var(--dim); font-weight: 500; font-size: 12px; margin-left: 4px; }
.up-desc { font-size: 11px; color: var(--faint); }
.up-cost { font-weight: 800; font-size: 13px; color: var(--gold); flex-shrink: 0; }
.upgrade-btn:disabled .up-cost { color: var(--faint); }

/* PÉNURIES */
.shortage-grid { display: grid; gap: 8px; }
.shortage-card { background: linear-gradient(155deg, #101a1c, #060c0d); border: 1px solid #1d3540; border-radius: var(--radius); padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 14px; width: 100%; transition: all 0.18s cubic-bezier(0.2,0.8,0.3,1); color: var(--text); font-family: inherit; text-align: left; }
.shortage-card:hover:not(:disabled) { border-color: var(--gem); box-shadow: 0 0 20px rgba(125,201,184,0.15), 0 8px 20px rgba(0,0,0,0.4); transform: translateY(-1px); }
.shortage-card:disabled { opacity: 0.4; cursor: not-allowed; }
.shortage-card.active { border-color: var(--gem); background: linear-gradient(155deg, #0a2420, #051210); box-shadow: 0 0 16px rgba(125,201,184,0.20); }
.sc-icon { font-size: 26px; flex-shrink: 0; }
.sc-body { flex: 1; min-width: 0; }
.sc-name { font-weight: 700; font-size: 14px; }
.sc-cont { font-size: 11px; color: var(--dim); margin-top: 2px; font-weight: 500; }
.sc-desc { font-size: 10px; color: var(--faint); margin-top: 3px; }
.sc-cost { font-weight: 800; font-size: 14px; color: var(--gem); flex-shrink: 0; }
.shortage-card.active .sc-cost { font-size: 11px; letter-spacing: 0.5px; }
.shortage-card:disabled .sc-cost { color: var(--faint); }

/* VUE CONTINENT */
.back-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 9px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 12px; transition: all 0.15s; }
.back-btn:hover { background: var(--card-hover); border-color: var(--border-lit); }
.cont-header { background: linear-gradient(155deg, var(--card), var(--card-2)); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 12px; text-align: center; position: relative; overflow: hidden; }
.cont-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--crimson), transparent); opacity: 0.7; }
.cont-header-name { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
.cont-header-pct { font-size: 44px; font-weight: 900; color: var(--blood); letter-spacing: -2px; line-height: 1; }
.cont-header-count { font-size: 12px; color: var(--faint); margin-top: 6px; }
.country-list { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
.country-row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; padding: 11px 16px; align-items: center; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.12s; }
.country-row:last-child { border-bottom: none; }
.country-row:hover:not(.dead) { background: var(--card-hover); }
.country-row:active:not(.dead) { background: var(--card-active); }
.country-row.dead { opacity: 0.35; cursor: default; }
.country-row.flash { animation: row-flash 0.28s ease; }
@keyframes row-flash { 0% { background: rgba(143,44,56,0.30); } 100% { background: transparent; } }
.cr-info { min-width: 0; }
.cr-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cr-sub { font-size: 10px; color: var(--faint); margin-top: 2px; }
.cr-pct { font-weight: 800; font-size: 14px; color: var(--blood); text-align: right; min-width: 64px; }
.cr-dmg { font-size: 11px; color: var(--gold); text-align: right; min-width: 76px; font-weight: 600; }
.cr-dmg.dead-icon { color: var(--dim); font-size: 16px; }

/* STATS */
.stats-block { background: linear-gradient(155deg, var(--card), var(--card-2)); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.stats-block-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--dim); font-weight: 700; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.stats-big { font-size: 32px; font-weight: 900; color: var(--blood); letter-spacing: -1.2px; line-height: 1; margin-bottom: 4px; }
.stats-big-label { font-size: 11px; color: var(--faint); margin-bottom: 14px; font-weight: 500; }
.stats-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(40,24,28,0.6); font-size: 13px; }
.stats-row:last-child { border-bottom: none; }
.stats-row .label { color: var(--dim); display: flex; align-items: center; gap: 8px; font-weight: 500; }
.stats-row .value { font-weight: 800; color: var(--bone); }
.stats-row .value.gold { color: var(--gold); }
.stats-row .value.blood { color: var(--blood); }
.stats-row .value.dim { color: var(--faint); font-weight: 600; }
.stats-formula { background: #050203; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 12px; color: var(--dim); margin-bottom: 12px; font-family: 'SF Mono', Menlo, Consolas, monospace; line-height: 1.6; }
.stats-formula strong { color: var(--blood); }
.stats-empty { color: var(--faint); font-size: 12px; text-align: center; padding: 20px 0; font-style: italic; }
.res-table { font-size: 12px; }
.res-row { display: grid; grid-template-columns: 1fr 60px 80px; padding: 7px 0; border-bottom: 1px solid rgba(40,24,28,0.5); align-items: center; }
.res-row:last-child { border-bottom: none; }
.res-row .res-name { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-row .res-val { color: var(--crimson); font-weight: 700; text-align: right; }
.res-row .res-dmg { color: var(--gold); font-weight: 700; text-align: right; }

/* QUIZ CAPITALES */
.quiz-wrap { max-width: 620px; margin: 0 auto; }
.quiz-stats { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.qs-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; }
.qs-label { font-size: 9px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 4px; }
.qs-value { font-size: 20px; font-weight: 800; color: var(--gold); }
.qs-value.streak { color: var(--blood); text-shadow: 0 0 12px rgba(176,74,82,0.25); }
.qs-value.best { color: var(--gem); }
.qs-value.lives { display: flex; gap: 2px; justify-content: center; }
.heart { font-size: 18px; line-height: 1; }
.heart.full { color: var(--blood); text-shadow: 0 0 6px rgba(176,74,82,0.4); }
.heart.empty { color: var(--faint); opacity: 0.4; }
.quiz-milestones { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 14px; }
.qm-badge { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 10px; font-weight: 700; color: var(--faint); transition: all 0.2s; }
.qm-badge.hit { background: linear-gradient(155deg, #0a2418, #051210); border-color: var(--green); color: var(--green); box-shadow: 0 0 12px rgba(110,184,122,0.20); }
.qm-badge .qm-streak { font-size: 13px; font-weight: 800; display: block; margin-bottom: 2px; }
.qm-badge .qm-reward { font-size: 9px; opacity: 0.8; }
.quiz-card { background: linear-gradient(155deg, var(--card), var(--card-2)); border: 1px solid var(--border-lit); border-radius: var(--radius); padding: 24px 22px; margin-bottom: 14px; position: relative; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
.quiz-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--crimson), transparent); opacity: 0.7; }
.quiz-q-label { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 10px; }
.quiz-q-country { font-size: 32px; font-weight: 900; color: var(--blood); letter-spacing: -1px; line-height: 1.1; margin-bottom: 6px; }
.quiz-q-cont { font-size: 12px; color: var(--dim); margin-bottom: 20px; font-weight: 500; }
.quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cap-option { background: linear-gradient(155deg, var(--card-hover), var(--card-2)); border: 1px solid var(--border-lit); border-radius: var(--radius-sm); padding: 16px 14px; cursor: pointer; color: var(--text); font-family: inherit; font-weight: 700; font-size: 14px; transition: all 0.15s cubic-bezier(0.2,0.8,0.3,1); text-align: center; min-height: 58px; display: flex; align-items: center; justify-content: center; }
.cap-option:hover:not(:disabled) { border-color: var(--crimson); background: linear-gradient(155deg, var(--card-active), var(--card-2)); box-shadow: 0 0 20px rgba(143,44,56,0.20); transform: translateY(-1px); }
.cap-option:disabled { cursor: default; }
.cap-option.correct { border-color: var(--green); background: linear-gradient(155deg, #0a2415, #051208); color: var(--green); box-shadow: 0 0 20px rgba(110,184,122,0.25); }
.cap-option.wrong { border-color: var(--red); background: linear-gradient(155deg, #240a10, #120507); color: var(--red); box-shadow: 0 0 20px rgba(198,96,96,0.25); animation: shake 0.35s ease; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* GAME OVER CAPITALES */
.game-over { max-width: 520px; margin: 0 auto; padding: 30px 16px; text-align: center; animation: fadeIn 0.4s ease; }
.go-icon { font-size: 52px; margin-bottom: 12px; filter: drop-shadow(0 4px 18px rgba(143,44,56,0.3)); animation: goPulse 2s ease-in-out infinite; }
@keyframes goPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.go-title { font-size: 34px; font-weight: 900; letter-spacing: -1.5px; color: var(--blood); margin-bottom: 6px; text-shadow: 0 0 24px rgba(176,74,82,0.25); }
.go-sub { color: var(--dim); font-size: 13px; margin-bottom: 28px; font-weight: 500; letter-spacing: 0.3px; }
.go-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.go-stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.go-stat-label { display: block; font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
.go-stat-value { display: block; font-size: 24px; font-weight: 800; color: var(--blood); }
.go-rewards { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 22px; text-align: left; }
.go-rewards-title { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; margin-bottom: 10px; }
.go-reward-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(40,24,28,0.6); font-size: 13px; color: var(--text); }
.go-reward-row:last-of-type { border-bottom: none; }

  for (const p of living) { const r = p.pop - p.morts; tl += r; w += r * (1 - p.res/100); }

  if (n >= 100) return Math.floor(n).toString();
  if (n >= 10) return n.toFixed(0);
  if (n >= 1) return n.toFixed(1).replace('.', ',');
  if (n > 0) return n.toFixed(2).replace('.', ',');
  return '0';
};

  let changed = false;
  for (let m of state.missions) {
    if (m.completed) continue;
    if (m.type === type) {
      if (type === 'click_specific' && m.countryTarget !== extra) continue;
      m.progress += amount;
      if (m.progress >= m.target) {
        m.progress = m.target;
        m.completed = true;
        state.money += m.rewardMoney;
        state.gems += m.rewardGems;
        updateGemDisplay();
        showToast(`🎯 Mission accomplie ! +${fmtEuro(m.rewardMoney)} · +${m.rewardGems} 💎`);
      }
      changed = true;
    }
  }
  if (changed) updateMissionUI();
}

function updateMissionUI() {
  const container = document.getElementById('missions-container');
  if (!container || !state.missions) return;
  container.innerHTML = state.missions.map(m => `
    <div class="mission-card ${m.completed ? 'completed' : ''}">
      <div class="mission-info">
        <div class="mission-title">${m.desc}</div>
        <div class="mission-reward">+${fmtEuro(m.rewardMoney)} · +${m.rewardGems} 💎</div>
      </div>
      <div class="mission-progress">${m.completed ? '✓' : m.progress + '/' + m.target}</div>
    </div>
  `).join('');
}

function updateGemDisplay() { const g = document.getElementById('gems'); if (g) g.textContent = state.gems; }
function showToast(text) {

  t.className = 'toast'; t.textContent = text;

function spawnFloat(el, text) {

// ============================================================
// ACTIONS DU JEU
// ============================================================
function clickCountry(p, rowEl) {
  if (state.won || state.energy < 10) return;
  const remaining = p.pop - p.morts;
  if (remaining <= 0.01) return;
  
  state.energy -= 10;
  state.clickCount++;
  const dmg = Math.min(remaining, mortaliteDamage() * (1 - p.res/100));
  
  if (p.morts <= 0.01) trackMission('infect', 1);
  p.morts += dmg;
  
  trackMission('click', 1);
  trackMission('click_specific', 1, p.nom);
  checkBadges();

  if (rowEl) {
    rowEl.classList.remove('flash'); void rowEl.offsetWidth; rowEl.classList.add('flash');
    spawnFloat(rowEl, '+' + fmt(dmg));
  }
}
function buyMortalite() { if (state.mortaliteLevel >= 8 || state.money < mortaliteCost()) return; state.money -= mortaliteCost(); state.mortaliteLevel++; trackMission('upgrade', 1); checkBadges(); }
function buyContagion() { if (state.contagionLevel >= 20 || state.money < contagionCost()) return; state.money -= contagionCost(); state.contagionLevel++; trackMission('upgrade', 1); checkBadges(); }
function buyEnergie()   { if (state.energieLevel >= 21 || state.money < energieCost()) return; state.money -= energieCost(); state.energieLevel++; trackMission('upgrade', 1); checkBadges(); }
function buyShortage(c) {
  if (state.shortages[c.id] || state.gems < c.penurie.gems) return;
  state.gems -= c.penurie.gems;
  state.shortages[c.id] = true;
  showToast(`${c.penurie.emoji} ${c.penurie.nom} activée en ${c.nom}`);
  updateGemDisplay();
  updateShortageCard(c);
}

// ============================================================
// BOUCLE DE JEU
// ============================================================
let lastTick = performance.now();
let lastUI = 0;

function tick(now) {
  const dt = Math.min((now - lastTick) / 1000, 0.5);
  lastTick = now;

  if (!state.won) {
    state.energy = Math.min(state.maxEnergy, state.energy + energyPerSec() * dt);

    const cDmg = contagionDamage() * dt;
    if (cDmg > 0) {
      const seeded = []; let totalW = 0;
      for (const c of CONTINENTS) for (const p of c.pays) {
        if (p.morts > 0 && p.morts < p.pop) {
          const w = p.pop * (1 - p.res/100);
          if (w > 0) { seeded.push({p, w}); totalW += w; }
        }
      }
      if (totalW > 0) for (const s of seeded) s.p.morts = Math.min(s.p.pop, s.p.morts + cDmg * (s.w / totalW));
    }

    for (const c of CONTINENTS) {
      if (state.shortages[c.id]) {
        c._timer = (c._timer || 0) + dt;
        while (c._timer >= 2) {
          c._timer -= 2;
          const dmg = mortaliteDamage();
          const living = c.pays.filter(p => p.morts < p.pop - 0.01);
          if (living.length) {
            let tl = 0; for (const p of living) tl += (p.pop - p.morts);
            for (const p of living) {
              const share = (p.pop - p.morts) / tl;
              p.morts = Math.min(p.pop, p.morts + dmg * share * (1 - p.res/100));
            }
          }
        }
      }
    }

    state.money += incomePerSec() * dt;
    const pct = (totalMorts() / WORLD_POP) * 100;
    
    while (state.milestone < MILESTONES.length && pct >= MILESTONES[state.milestone].pct) {
      const m = MILESTONES[state.milestone];
      if (m.reward > 0) { state.money += m.reward; showToast(`🎯 Palier ${m.label} — +${fmtEuro(m.reward)}`); }
      state.milestone++;
      if (m.victory) state.won = true;
    }
    
    // Vérification périodique des badges basés sur les morts
    checkBadges();
  }

  if (now - lastUI > 100) { lastUI = now; updateUI(); }
  requestAnimationFrame(tick);
}

// ============================================================
// MISE À JOUR INTERFACE
// ============================================================
function updateUI() {
  if (state.won) return;
  const tm = totalMorts();
  const pct = (tm / WORLD_POP) * 100;
  const $ = id => document.getElementById(id);

  if ($('money')) $('money').textContent = fmtEuro(state.money);
  if ($('income')) $('income').textContent = '+' + fmtEuro(incomePerSec()) + '/s';
  if ($('killPct')) $('killPct').textContent = fmtPct(pct);
  if ($('killCount')) $('killCount').textContent = fmt(tm) + ' / 8,131 Md';
  if ($('energyFill')) $('energyFill').style.width = (state.energy / state.maxEnergy * 100) + '%';
  if ($('energyText')) $('energyText').textContent = Math.floor(state.energy) + ' / ' + state.maxEnergy + ' — ' + Math.floor(state.energy/10) + ' clics';

  if (state.milestone < MILESTONES.length) {
    const next = MILESTONES[state.milestone];
    const prevPct = state.milestone > 0 ? MILESTONES[state.milestone-1].pct : 0;
    const prog = Math.min(100, Math.max(0, (pct - prevPct) / (next.pct - prevPct) * 100));
    if ($('milestoneFill')) $('milestoneFill').style.width = prog + '%';
    if ($('milestoneText')) $('milestoneText').textContent = next.label + ' → +' + fmtEuro(next.reward);
    if ($('milestoneCount')) $('milestoneCount').textContent = state.milestone + ' / ' + MILESTONES.length;
  }

  updateUpgradeBtns();
  if (state.view === 'world') updateWorldView();
  else if (state.view === 'stats') updateStatsView();
  else if (state.view !== 'capitales' && state.view !== 'missions') updateContinentView();
}

function updateUpgradeBtns() {
  const setBtn = (id, maxed, lvl, desc, cost) => {
    const b = document.getElementById('up-' + id); if (!b) return;
    b.disabled = maxed || state.money < cost;
    const l = b.querySelector('.lvl'); if (l) l.textContent = maxed ? '(MAX)' : 'niv. ' + lvl;
    const d = b.querySelector('.up-desc'); if (d) d.textContent = desc;
    const c = b.querySelector('.up-cost'); if (c) c.textContent = maxed ? '—' : fmtEuro(cost);
  };
  setBtn('mortalite', state.mortaliteLevel >= 8, state.mortaliteLevel, fmt(mortaliteDamage()) + ' dégâts/clic', mortaliteCost());
  setBtn('contagion', state.contagionLevel >= 20, state.contagionLevel, fmt(contagionDamage()) + ' morts/s (pays semés)', contagionCost());
  setBtn('energie', state.energieLevel >= 21, state.energieLevel, 'Recharge : ' + rechargeSec().toFixed(1) + ' s/clic', energieCost());
}

function updateWorldView() {
  for (const c of CONTINENTS) {
    const cm = countMorts(c), cp = countPop(c), pct = (cm / cp) * 100;
    const pe = document.getElementById('c-pct-' + c.id); if (pe) pe.textContent = fmtPct(pct);
    const ce = document.getElementById('c-cnt-' + c.id); if (ce) ce.textContent = fmt(cm) + ' / ' + fmt(cp);
    const be = document.getElementById('c-bar-' + c.id); if (be) be.style.width = pct + '%';
    updateShortageCard(c);
  }
}

function updateShortageCard(c) {
  const btn = document.getElementById('short-' + c.id); if (!btn) return;
  const bought = !!state.shortages[c.id];
  btn.disabled = bought || state.gems < c.penurie.gems;
  btn.classList.toggle('active', bought);
  const cost = btn.querySelector('.sc-cost');
  if (cost) cost.textContent = bought ? '✓ ACTIVE' : c.penurie.gems + ' 💎';
}

function updateContinentView() {
  const c = CONTINENTS.find(x => x.id === state.view); if (!c) return;
  const cm = countMorts(c), cp = countPop(c);
  const pctEl = document.getElementById('detail-pct'); if (pctEl) pctEl.textContent = fmtPct(cm/cp*100);
  const cntEl = document.getElementById('detail-cnt'); if (cntEl) cntEl.textContent = fmt(cm) + ' morts sur ' + fmt(cp);
  for (let i = 0; i < c.pays.length; i++) {
    const p = c.pays[i]; const row = document.getElementById('row-' + c.id + '-' + i); if (!row) continue;
    const dead = p.morts >= p.pop - 0.01;
    const pe = row.querySelector('.cr-pct'); if (pe) pe.textContent = fmtPct((p.morts / p.pop) * 100);
    const de = row.querySelector('.cr-dmg');
    if (de) {
      if (dead) { de.textContent = '☠️'; de.classList.add('dead-icon'); }
      else { de.textContent = '+' + fmt(mortaliteDamage() * (1 - p.res/100)) + '/clic'; de.classList.remove('dead-icon'); }
    }
    if (dead && !row.classList.contains('dead')) row.classList.add('dead');
  }
}

function updateStatsView() {
  const cDPS = contagionDamage();
  const pens = [];
  for (const c of CONTINENTS) if (state.shortages[c.id]) pens.push({ c, dps: penurieDPS(c) });
  const totalDPS = cDPS + pens.reduce((s,p) => s + p.dps, 0);
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('stat-total-dps', fmt(totalDPS) + ' /s');
  set('stat-contagion-dps', fmt(cDPS) + ' /s');
  for (const p of pens) set('stat-pen-' + p.c.id + '-dps', fmt(p.dps) + ' /s');
  set('stat-base-dmg', fmt(mortaliteDamage()));
  for (const c of CONTINENTS) {
    const cm = countMorts(c), cp = countPop(c);
    set('stats-c-pct-' + c.id, fmtPct(cm/cp*100));
    set('stats-c-cnt-' + c.id, fmt(cm) + ' / ' + fmt(cp));
  }
}

  if (state.view === 'stats') return renderStats();

// ============================================================
// ÉVÉNEMENTS DU JEU
// ============================================================
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const action = el.dataset.action;

  if (['tab', 'open', 'back', 'hit', 'buy', 'buy-shortage', 'restart'].includes(action)) {
    if (action === 'tab') {
      state.view = el.dataset.tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.view));
      renderMain();
    } else if (action === 'open') {
      state.view = el.dataset.cid;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'world'));
      renderMain();
    } else if (action === 'back') {
      state.view = 'world'; renderMain();
    } else if (action === 'hit') {
      if (el.classList.contains('dead')) return;
      const c = CONTINENTS.find(x => x.id === el.dataset.cid);
      const p = c.pays[parseInt(el.dataset.idx)];
      clickCountry(p, el);
    } else if (action === 'buy') {
      const t = el.dataset.type;
      if (t === 'mortalite') buyMortalite();
      else if (t === 'contagion') buyContagion();
      else if (t === 'energie') buyEnergie();
    } else if (action === 'buy-shortage') {
      buyShortage(CONTINENTS.find(x => x.id === el.dataset.cid));
    } else if (action === 'restart') {
      restart();
    }
  }
});

function restart() {
  clearSave();
  for (const c of CONTINENTS) { delete c._timer; for (const p of c.pays) p.morts = 0; }
  state.money = 300; state.gems = 0; state.energy = 100; state.mortaliteLevel = 0; state.contagionLevel = 0; state.energieLevel = 0;
  state.view = 'world'; state.shortages = {}; state.milestone = 0; state.won = false;
  state.clickCount = 0; state.quizTotalCorrect = 0; state.quizBestStreak = 0;
  state.badges.forEach(b => b.unlocked = false);
  generateMissions();
  if (window.Capitals) window.Capitals.reset();
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'world'));
  renderMain();
}

// ============================================================
// MODE CAPITALES
// ============================================================
const Capitals = (() => {
  const ALL_COUNTRIES = [];
  for (const c of CONTINENTS) for (const p of c.pays) {
    if (p.capitale) ALL_COUNTRIES.push({ country: p.nom, capital: p.capitale, continentId: c.id, continentName: c.nom, emoji: c.emoji });
  }

  const MAX_LIVES = 3;
  const qs = { current: null, streak: 0, bestStreak: 0, milestonesHit: new Set(), totalCorrect: 0, totalWrong: 0, lives: MAX_LIVES, locked: false, gameOver: false, sessionReward: { money: 0, gems: 0 } };

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function newQuestion() {
    if (ALL_COUNTRIES.length === 0) return;
    const answer = ALL_COUNTRIES[Math.floor(Math.random() * ALL_COUNTRIES.length)];
    const sameCont = ALL_COUNTRIES.filter(x => x.continentId === answer.continentId && x.capital !== answer.capital);
    const others = ALL_COUNTRIES.filter(x => x.continentId !== answer.continentId && x.capital !== answer.capital);
    const distractors = [];
    shuffle(sameCont);
    for (const s of sameCont) { if (distractors.length >= 2) break; if (!distractors.find(d => d.capital === s.capital)) distractors.push(s); }
    shuffle(others);
    for (const o of others) { if (distractors.length >= 3) break; if (!distractors.find(d => d.capital === o.capital)) distractors.push(o); }
    while (distractors.length < 3) { const d = ALL_COUNTRIES[Math.floor(Math.random() * ALL_COUNTRIES.length)]; if (d.capital !== answer.capital && !distractors.find(x => x.capital === d.capital)) distractors.push(d); }
    const options = shuffle([answer.capital, ...distractors.slice(0, 3).map(d => d.capital)]);
    qs.current = { answer, options, answered: false, chosen: null };
    qs.locked = false;
  }

  function checkMilestones() {
    for (let i = 0; i < QUIZ_MILESTONES.length; i++) {
      const m = QUIZ_MILESTONES[i];
      if (qs.streak >= m.streak && !qs.milestonesHit.has(i)) {
        qs.milestonesHit.add(i);
        state.money += m.money; state.gems += m.gems; updateGemDisplay();
        qs.sessionReward.money += m.money; qs.sessionReward.gems += m.gems;
        showToast(`🔥 Série de ${m.streak} — +${fmtEuro(m.money)} · +${m.gems} 💎`);
        const badge = document.getElementById('qm-' + i); if (badge) badge.classList.add('hit');
      }
    }
  }

  function answer(chosen) {
    if (!qs.current || qs.current.answered || qs.locked || qs.gameOver) return;
    qs.locked = true; qs.current.answered = true; qs.current.chosen = chosen;
    const correct = chosen === qs.current.answer.capital;

    if (correct) { 
      qs.streak++; qs.totalCorrect++; state.quizTotalCorrect++;
      if (qs.streak > qs.bestStreak) qs.bestStreak = qs.streak; 
      if (qs.streak > state.quizBestStreak) state.quizBestStreak = qs.streak;
      saveGame();
      
      checkMilestones(); 
      trackMission('quiz', 1);
      checkBadges();
    }
    else { qs.streak = 0; qs.totalWrong++; qs.lives--; }

    document.querySelectorAll('.cap-option').forEach(btn => {
      btn.disabled = true; const cap = btn.dataset.cap;
      if (cap === qs.current.answer.capital) btn.classList.add('correct');
      else if (cap === chosen) btn.classList.add('wrong');
    });
    
    updateStatsBar();

    // Si on n'a plus de vie, on affiche le Game Over après un petit délai
    if (qs.lives <= 0) { 
      setTimeout(() => { 
        qs.gameOver = true; 
        render(); 
        saveGame(); 
      }, 900); 
      return; 
    }
    
    // Sinon, on passe à la question suivante
    setTimeout(() => { 
      if (state.view !== 'capitales' || qs.gameOver) return; 
      newQuestion(); 
      renderQuestion(); 
    }, correct ? 550 : 1050);
  }

  function updateStatsBar() {
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
    set('q-best', state.quizBestStreak || 0);
        const lives = document.getElementById('q-lives');
    if (lives) { lives.innerHTML = ''; for (let i = 0; i < MAX_LIVES; i++) { const h = document.createElement('span'); h.className = 'heart ' + (i < qs.lives ? 'full' : 'empty'); h.textContent = '❤️'; lives.appendChild(h); } }
  }

  function render() {
    const main = document.getElementById('main'); if (!main) return;
    if (qs.gameOver) { renderGameOver(main); return; }
    if (!qs.current) newQuestion();

    let html = `<div class="quiz-wrap"><div class="quiz-stats">
      <div class="qs-card"><div class="qs-label">Série</div><div class="qs-value streak" id="q-streak">${qs.streak}</div></div>
      <div class="qs-card"><div class="qs-label">Record</div><div class="qs-value best" id="q-best">${state.quizBestStreak || 0}</div></div>      <div class="qs-card"><div class="qs-label">Bonnes</div><div class="qs-value" id="q-correct">${qs.totalCorrect}</div></div>
      <div class="qs-card"><div class="qs-label">Vies</div><div class="qs-value lives" id="q-lives"></div></div>
    </div><div class="quiz-milestones">`;

    QUIZ_MILESTONES.forEach((m, i) => {
      const hit = qs.milestonesHit.has(i);
      html += `<div class="qm-badge ${hit?'hit':''}" id="qm-${i}"><span class="qm-streak">${m.streak}</span><span class="qm-reward">+${m.gems}💎</span></div>`;
    });

    html += `</div><div id="quiz-card-container"></div></div>`;
    main.innerHTML = html; renderQuestion(); updateStatsBar();
  }

  function renderQuestion() {
    const container = document.getElementById('quiz-card-container'); if (!container || !qs.current) return;
    const q = qs.current;
    let html = `<div class="quiz-card"><div class="quiz-q-label">${q.answer.emoji} ${q.answer.continentName}</div><div class="quiz-q-country">${q.answer.country}</div><div class="quiz-q-cont">Quelle est la capitale de ce pays ?</div><div class="quiz-options">`;
    for (const cap of q.options) html += `<button class="cap-option" data-action="cap-answer" data-cap="${cap.replace(/"/g,'&quot;')}" ${q.answered?'disabled':''}>${cap}</button>`;
    html += `</div></div>`;
    container.innerHTML = html;

    if (q.answered) {
      container.querySelectorAll('.cap-option').forEach(btn => { btn.disabled = true; if (btn.dataset.cap === q.answer.capital) btn.classList.add('correct'); else if (btn.dataset.cap === q.chosen) btn.classList.add('wrong'); });
    }
  }

  function renderGameOver(main) {
    const hitCount = qs.milestonesHit.size; let rewardRows = '';
    if (hitCount === 0) rewardRows = `<div class="go-empty">Aucun palier atteint cette fois.<br>Il faut 5 bonnes réponses consécutives pour la première récompense.</div>`;
    else {
      QUIZ_MILESTONES.forEach((m, i) => { if (qs.milestonesHit.has(i)) rewardRows += `<div class="go-reward-row"><span class="label">Série de ${m.streak}</span><span class="value">+${fmtEuro(m.money)} · +${m.gems} 💎</span></div>`; });
      rewardRows += `<div class="go-reward-total"><span>Total obtenu</span><span>+${fmtEuro(qs.sessionReward.money)} · +${qs.sessionReward.gems} 💎</span></div>`;
    }
    main.innerHTML = `<div class="game-over"><div class="go-icon">💀</div><div class="go-title">Partie terminée</div><div class="go-sub">Tes trois vies sont épuisées.</div>
<span class="go-stat-value">${state.quizBestStreak || 0}</span>      <div class="go-rewards"><div class="go-rewards-title">Récompenses obtenues</div>${rewardRows}</div>
      <div class="go-actions"><button class="go-btn primary" data-action="cap-restart">↻ Rejouer</button><button class="go-btn" data-action="cap-home">← Accueil</button></div></div>`;
  }

  function reset() {
    qs.current = null; qs.streak = 0; qs.bestStreak = 0; qs.milestonesHit.clear();
    qs.totalCorrect = 0; qs.totalWrong = 0; qs.lives = MAX_LIVES;
    qs.locked = false; qs.gameOver = false; qs.sessionReward = { money: 0, gems: 0 };
  }

  return {
    render, answer, reset,
    restart: () => { reset(); render(); saveGame(); },
    goHome: () => { reset(); state.view = 'world'; document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'world')); renderMain(); saveGame(); }
  };
})();

window.Capitals = Capitals;

// Écouteur spécifique quiz
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const a = el.dataset.action;
  if (!a.startsWith('cap-')) return;
  if (a === 'cap-answer') Capitals.answer(el.dataset.cap);
  else if (a === 'cap-restart') Capitals.restart();
  else if (a === 'cap-home') Capitals.goHome();
});


// ============================================================
// CLASSEMENT / LEADERBOARD (SUPABASE)
// ============================================================
async function saveScoreToDatabase() {
  if (!currentUser) return; // Si pas connecté, on ne fait rien
  
  const currentScore = totalMorts(); // On sauvegarde le nombre total de morts
  if (currentScore === 0) return;

  const { error } = await supabase
    .from('leaderboard')
    .upsert({
      id: currentUser.id,
      username: currentUser.user_metadata.full_name || 'Savant Anonyme',
      score: currentScore,
      updated_at: new Date().toISOString()
    }, { onConflict: 'id' });

  if (error) console.error("Erreur de sauvegarde :", error.message);
}

async function loadLeaderboard() {
  const { data, error } = await supabase
    .from('leaderboard')
    .select('username, score')
    .order('score', { ascending: false })
    .limit(10);

  if (error) {
    console.error("Erreur classement :", error.message);
    document.getElementById('main').innerHTML = '<div class="stats-empty">Erreur de chargement.</div>';
    return;
  }
  renderLeaderboard(data);
}

function renderLeaderboard(data) {
  let html = '<div class="section-title">Top 10 des Savants Fous <span class="tag">Global</span></div>';
  
  if (!data || data.length === 0) {
    html += '<div class="stats-empty">Aucun score enregistré pour le moment.</div>';
  } else {
    html += '<div class="stats-block"><div class="res-table">';
    data.forEach((player, index) => {
      let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
      html += `
        <div class="res-row" style="grid-template-columns: 40px 1fr 100px;">
          <span style="font-weight:bold; color:var(--dim);">${medal}</span>
          <span class="res-name" style="color:var(--bone);">${player.username}</span>
          <span class="res-val">${fmt(player.score)} morts</span>
        </div>`;
    });
    html += '</div></div>';
  }
  
  document.getElementById('main').innerHTML = html;
}

// ============================================================
// SYSTÈME DE SAUVEGARDE
// ============================================================
function saveGame() {
  if (state.won) return; 
  const saveData = {
    money: state.money, gems: state.gems, energy: state.energy,
    mortaliteLevel: state.mortaliteLevel, contagionLevel: state.contagionLevel,
    energieLevel: state.energieLevel, milestone: state.milestone,
    shortages: state.shortages, missions: state.missions,
    clickCount: state.clickCount, quizTotalCorrect: state.quizTotalCorrect,
              quizBestStreak: state.quizBestStreak || 0,
    unlockedBadges: state.badges.filter(b => b.unlocked).map(b => b.id),
    countries: CONTINENTS.map(c => c.pays.map(p => p.morts))
  };
  localStorage.setItem('savantFouSave', JSON.stringify(saveData));
  saveScoreToDatabase();
}

function loadGame() {
  const saved = localStorage.getItem('savantFouSave');
  if (!saved) return;
  try {
    const data = JSON.parse(saved);
    Object.assign(state, {
      money: data.money, gems: data.gems, energy: data.energy,
      mortaliteLevel: data.mortaliteLevel, contagionLevel: data.contagionLevel,
      energieLevel: data.energieLevel, milestone: data.milestone,
      shortages: data.shortages, missions: data.missions,
      clickCount: data.clickCount, quizTotalCorrect: data.quizTotalCorrect,
               quizBestStreak: data.quizBestStreak || 0
    });
    
    if (data.countries) {
      for (let c = 0; c < CONTINENTS.length; c++) {
        for (let p = 0; p < CONTINENTS[c].pays.length; p++) {
          CONTINENTS[c].pays[p].morts = data.countries[c][p];
        }
      }
    }
    
    if (data.unlockedBadges) {
      state.badges.forEach(b => {
        if (data.unlockedBadges.includes(b.id)) b.unlocked = true;
      });
    }
  } catch (e) {
    console.error("Erreur lors du chargement de la sauvegarde", e);
  }
}

function clearSave() {
  localStorage.removeItem('savantFouSave');
}

setInterval(saveGame, 5000);

// ============================================================
// DÉMARRAGE
// ============================================================
loadGame(); 
if (!state.missions || state.missions.length === 0) generateMissions(); 
renderMain();
requestAnimationFrame(tick);
</script>
